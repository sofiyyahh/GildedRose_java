name: Java CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Build project
      - name: Compile project
        run: javac -d out src/com/alexaitken/gildedrose/*.java

      # Run tests
      - name: Run tests
        run: |
          javac -cp .:test:test/com/alexaitken/gildedrose/*.java -d out_test test/com/alexaitken/gildedrose/*.java
          java -cp out:out_test org.junit.runner.JUnitCore com.alexaitken.gildedrose.GildedRoseTest

      # Static Analysis with Checkstyle
      - name: Checkstyle
        run: |
          curl -L -o checkstyle-10.15-all.jar https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.15/checkstyle-10.15-all.jar
          java -jar checkstyle-10.15-all.jar -c /google_checks.xml src/com/alexaitken/gildedrose

      # Package artifact
      - name: Package JAR
        run: jar cvf GildedRose.jar -C out .

      # Upload artifact
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: GildedRose-JAR
          path: GildedRose.jar
